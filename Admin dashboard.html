<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Hostel Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <div class="top-left"><button class="menu-btn" id="menuBtn">☰</button><h2 id="pageTitle">Admin Dashboard</h2></div>
      <div class="user-chip" id="userChip"></div>
    </header>

    <main class="content">
      <!-- Each section is filled by script.js (adminRenderers) -->
      <section class="section" id="sec-dashboard"></section>
      <section class="section" id="sec-students"></section>
      <section class="section" id="sec-rooms"></section>
      <section class="section" id="sec-attendance"></section>
      <section class="section" id="sec-leaves"></section>
      <section class="section" id="sec-complaints"></section>
      <section class="section" id="sec-fees"></section>
      <section class="section" id="sec-notices"></section>
      <section class="section" id="sec-mess"></section>
      <section class="section" id="sec-contact"></section>
      <section class="section" id="sec-settings"></section>
    </main>
  </div>
</div>

<script src="script.js"></script>
<script>initAdmin();</script>
</body>
</html>
